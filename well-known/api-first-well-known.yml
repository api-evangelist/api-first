note: >-
  API-First is a topic index (kind: topic), not a company. It owns no domain and serves no
  /.well-known/ surface of its own. The hosts probed below belong to the third-party platforms
  this topic references — SmartBear (swagger.io), Stoplight (stoplight.io), Postman
  (www.postman.com) and Nordic APIs (nordicapis.com) — each of which is profiled separately in
  its own API Evangelist repository. Two real documents were found (Postman's RFC 9116
  security.txt, and llms.txt on Postman and Nordic APIs) but they are those companies' documents,
  not API-First's, so nothing was saved into this repository and NO WellKnown or SecurityTxt
  pointer was wired into apis.yml. Recording them here as a probe result is the honest record;
  claiming them for this profile would credit a methodology with a surface it does not serve.
